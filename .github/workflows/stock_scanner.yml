name: Daily DSE Stock Scan

on:
  workflow_dispatch:
  push:
    branches:
      - main
  schedule:
    - cron: '30 9 * * 1-5'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  scan-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run DSE Scanner
        run: python scanner.py

      - name: Ensure Report Directory Exists
        run: mkdir -p Stock_Report/bangla_summary

      # 👇 THIS IS THE NEW STEP THAT FIXES THE 404 👇
      - name: Create index.html from latest report
        run: |
          cd Stock_Report/bangla_summary/
          LATEST=$(ls -t *.html | head -n 1)
          echo "Copying $LATEST to index.html"
          cp "$LATEST" index.html

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact for Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'Stock_Report/bangla_summary/'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
