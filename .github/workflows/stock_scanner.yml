name: Daily DSE Stock Scan

on:
  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:
  
  # Automatically runs when you push a change to the main branch
  push:
    branches:
      - main
      
  # Runs at 9:30 AM UTC = 3:30 PM Bangladesh time (UTC+6). Monday to Friday.
  schedule:
    - cron: '30 9 * * 1-5'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  scan-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run DSE Scanner
        run: python scanner.py

      - name: Ensure Report Directory Exists
        run: mkdir -p Stock_Report/bangla_summary

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact for Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'Stock_Report/bangla_summary/'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
